name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: .\tests\test-powershell-syntax.ps1
      - name: Check panel contracts without camera access
        shell: powershell
        run: .\tests\run-self-tests.ps1
  linux-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          bash -n orion-camera.sh
          bash -n kernel/isolated-boot-check.sh
          for script in tests/*.sh; do bash -n "$script"; done
      - name: Camera and process safety tests (mocked, no hardware)
        run: python3 tests/test-camera-safety.py
      - name: Check documentation links
        run: python3 .github/check-docs.py
      - name: Build native adapter against pinned INDIGO 3.0-7
        run: |
          curl --fail --location --retry 3 \
            https://indigo-astronomy.github.io/indigo_ppa/ppa/pool/main/i/indigo3/indigo3-3.0-7-amd64.deb \
            --output "$RUNNER_TEMP/indigo.deb"
          echo "9cc3ace32e3d06b8816d60b48a5f687ee2fc661c735daa827c1fcecc32502d3a  $RUNNER_TEMP/indigo.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/indigo.deb" "$RUNNER_TEMP/indigo"
          make -C indigo CPPFLAGS="-I$RUNNER_TEMP/indigo/usr/include" LDFLAGS="-L$RUNNER_TEMP/indigo/usr/lib"
          make -C indigo DESTDIR="$RUNNER_TEMP/stage" install
